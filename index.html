<!-- Floating AI Chat -->
<div class="ai-chat-container">

    <button
        id="aiChatButton"
        class="ai-chat-button"
        type="button"
        aria-label="Open Elle's AI assistant"
        aria-expanded="false"
    >
        <span>✦</span>
    </button>

    <div
        id="aiChatWindow"
        class="ai-chat-window"
        aria-hidden="true"
    >
        <div class="ai-chat-header">
            <div>
                <strong>elle's ai ✦</strong>
                <small>ask me anything about my portfolio</small>
            </div>

            <button
                id="aiChatClose"
                class="ai-chat-close"
                type="button"
                aria-label="Close AI assistant"
            >
                ×
            </button>
        </div>

        <div class="ai-chat-content">
            <iframe
                src="https://www.chatbase.co/chatbot-iframe/BqIBfM-ix_T4n4dgczVK7"
                width="100%"
                height="100%"
                frameborder="0"
                referrerpolicy="no-referrer-when-downgrade"
                allow="microphone"
                title="Elle's AI Assistant"
            ></iframe>
        </div>
    </div>

</div>
